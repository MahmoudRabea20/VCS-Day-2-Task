<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
</head>
<body>
    <form action="Thankyou.htm" method="get" target="_blank">
        <fieldset>
            <legend>Personal Info</legend>
            <div>
                <!-- <label for="ui">User ID:</label> -->
                <input type="hidden" value="1" name="userId" id="ui">
            </div>
            <br>
            <div>
                <label for="fn">First Name:</label>&nbsp;
                <input type="text" id="fn" name="firstName" required>
            </div>
            <br>
            <div>
                <label for="ln">Last Name:</label>
                <input type="text" id="ln" name="lastName" required>
            </div>
            <br>
            <div>
                <label for="em">Email:</label>
                <input type="email" id="em" name="email" required>
            </div>
            <br>
            <div>
                <label for="p">Password:</label>
                <input type="password" id="p" name="password">
            </div>
            <br>
            <div>
                <label for="rp">Repeat Password:</label>
                <input type="password" id="rp" name="repeatedPassword">
            </div>
            <br>
            <div>
                <label for="bd">Birth Date:</label>
                <input type="date" id="bd" name="birthDate">
            </div>
            <br>
            <div>
                <label for="up">User Picture:</label>
                <input type="file" name="picture" id="up" accept="image/png, image/peg, image/gif">
            </div>
        </fieldset>
        <br>
        <fieldset>
            <legend>Gender</legend>
            
            <input type="radio" name="gender" value="male">
            <label for="m">Male</label>
            
            <input type="radio" name="gender" value="female">
            <label for="f">Female</label>
        </fieldset>
        <br>
        <label for="fac">Faculy:</label>
        <select name="faculy" id="fac">
            <option value="Cairo">Cairo</option>
            <option value="Helwan" selected>Helwan</option>
            <option value="Ain Shams">Ain Shams</option>
            <option value="Beni Suef">Beni Suef</option>
            <option value="Banha">Banha</option>
        </select>
        <br>
        <br>
        <div>
            <fieldset>
                <legend>Interests</legend>
                <input type="checkbox" name="Interests" value="Programming">
                <label>Programming</label>
                <input type="checkbox" name="Interests" value="Reading">
                <label>Reading</label>
                <input type="checkbox" name="Interests" value="Swimming">
                <label>Swimming</label>
                <input type="checkbox" name="Interests" value="Playing">
                <label>Playing</label>
            </fieldset>
        </div>
        <br>
        <div>
            <label for="ab">About me:</label>
            <textarea name="me" id="ab"></textarea>
        </div>
        <br>
        <div>
            <input type="checkbox" name="condition" id="c">
            <a href="terms.html" target="_blank" style="text-decoration: none; color: black; cursor: pointer;" >I agreed to terms and conditions</a>
        </div>
        <br>
        <div>
            <input type="submit">&nbsp;&nbsp;
            <input type="reset">
        </div>

    </form>
</body>
</html>
